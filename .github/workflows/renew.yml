name: Host-Ship 自动续约

on:
  schedule:
    # 每 3 日 1 次（UTC 04:17 = 北京 12:17，避开整点）。
    # 2026-11-21：cookie 实测只活 6 日，原来 7 日一轮永远差一天，结构性必死。
    # 压到 3 日一轮，漏跑一轮也还有余量；到期预警见 login-refresh.yml 的 guard job。
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (不真正续约)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read
  # 2026-11-23 自愈：认证全挂时用 workflow 自己的 token 触发 login-refresh（不需要 PAT）
  actions: write

concurrency:
  group: hostship-renew
  cancel-in-progress: false

jobs:
  renew:
    name: 续约
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出
        uses: actions/checkout@v7

      # 上游故障计数（连续几轮 522）。GHA 每次都是新容器，不恢复就是每轮从 0 起，
      # 「连续 3 轮才升级告警」永远触发不了。
      - name: ♻️ 恢复上游故障计数
        uses: actions/cache/restore@v4
        with:
          path: hs_upstream_state.json
          key: hsupstream-${{ github.run_id }}
          restore-keys: |
            hsupstream-

      # 迁移说明：原先手写 setup-python / pip install / 执行 三步，
      # 现改用 renew-kit 的 composite action，自动装好 Python 与 renewkit，
      # 并在脚本异常退出时兜底发一条 Telegram 通知。
      # 面板凭据通过本 step 的 env 传入，composite action 会继承。
      # renew-kit 钉在 tag 上（action 与 pip 两处都要钉）：main 上出过一次 composite
      # action 的语法错（空 then 分支），所有跟 @main 的仓库一起变红 —— 本仓当时
      # 用的是旧版 action 才侥幸躲过。升级就改这两个 v0.4.2。
      - name: 执行续约
        id: renew
        continue-on-error: true
        uses: jardanlau2020/renew-kit/.github/actions/renew@v0.6.0
        with:
          script: renew.py
          python-version: "3.12"
          renewkit-ref: v0.6.0
          requirements: requirements.txt
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          PANEL_USER: ${{ secrets.PANEL_USER }}
          PANEL_PASS: ${{ secrets.PANEL_PASS }}
          SERVER_IDS: ${{ secrets.SERVER_IDS }}
          # 2026-11-23：首选纯 Bearer（不登录、不过 Turnstile、不受 cookie 寿命影响）
          HS_API_KEY: ${{ secrets.HS_API_KEY }}
          JEXACTYL_SESSION: ${{ secrets.JEXACTYL_SESSION }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}

      # ── 2026-11-23 自愈：三种认证（API Key / cookie / 帐密）全挂时主动重新登录 ──
      # login-refresh.yml 会自己登录 + 用 GH_PAT 回写 secret，但它的定时是「每 3 天一次」；
      # cookie 若在两次之间死掉（站方清 session、换密钥），就会空等最多 3 天。
      # 这里失败即触发一次，下一轮 cron（3 小时）就能拿到新 cookie。
      # 用 workflow 自己的 token（actions: write），不需要额外 PAT。
      - name: 自愈 · 认证失败则触发重新登录
        if: steps.renew.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "本轮续约失败（认证或上游）→ 触发 login-refresh.yml 重新登录并回写 cookie"
          if gh workflow run login-refresh.yml --repo "${{ github.repository }}" --ref main -f mode=login; then
            sleep 8
            gh run list --repo "${{ github.repository }}" --workflow login-refresh.yml --limit 1 \
              --json databaseId,status,event,createdAt \
              --jq '.[] | "已触发 login-refresh run \(.databaseId) status=\(.status) event=\(.event)"'
          else
            echo "::warning::触发 login-refresh 失败 —— 检查 workflow 的 actions: write 权限或仓设置"
          fi

      - name: 💾 保存上游故障计数
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: hs_upstream_state.json
          key: hsupstream-${{ github.run_id }}
      - name: 结论 · 本轮没续上（保持非绿，别让失败看起来像成功）
        if: steps.renew.outcome == 'failure'
        run: exit 1
