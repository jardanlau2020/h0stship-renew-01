name: Host-Ship 鑷姩缁害

on:
  schedule:
    # 姣?3 鏃?1 娆★紙UTC 04:17 = 鍖椾含 12:17锛岄伩寮€鏁寸偣锛夈€?
    # 2026-11-21锛歝ookie 瀹炴祴鍙椿 6 鏃ワ紝鍘熸潵 7 鏃ヤ竴杞案杩滃樊涓€澶╋紝缁撴瀯鎬у繀姝汇€?
    # 鍘嬪埌 3 鏃ヤ竴杞紝婕忚窇涓€杞篃杩樻湁浣欓噺锛涘埌鏈熼璀﹁ login-refresh.yml 鐨?guard job銆?
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (涓嶇湡姝ｇ画绾?"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read
  # 2026-11-23 鑷剤锛氳璇佸叏鎸傛椂鐢?workflow 鑷繁鐨?token 瑙﹀彂 login-refresh锛堜笉闇€瑕?PAT锛?
  actions: write

concurrency:
  group: hostship-renew
  cancel-in-progress: false

jobs:
  renew:
    name: 缁害
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 妫€鍑?
        uses: actions/checkout@v7

      # 涓婃父鏁呴殰璁℃暟锛堣繛缁嚑杞?522锛夈€侴HA 姣忔閮芥槸鏂板鍣紝涓嶆仮澶嶅氨鏄瘡杞粠 0 璧凤紝
      # 銆岃繛缁?3 杞墠鍗囩骇鍛婅銆嶆案杩滆Е鍙戜笉浜嗐€?
      - name: 鈾伙笍 鎭㈠涓婃父鏁呴殰璁℃暟
        uses: actions/cache/restore@v4
        with:
          path: hs_upstream_state.json
          key: hsupstream-${{ github.run_id }}
          restore-keys: |
            hsupstream-

      # 杩佺Щ璇存槑锛氬師鍏堟墜鍐?setup-python / pip install / 鎵ц 涓夋锛?
      # 鐜版敼鐢?renew-kit 鐨?composite action锛岃嚜鍔ㄨ濂?Python 涓?renewkit锛?
      # 骞跺湪鑴氭湰寮傚父閫€鍑烘椂鍏滃簳鍙戜竴鏉?Telegram 閫氱煡銆?
      # 闈㈡澘鍑嵁閫氳繃鏈?step 鐨?env 浼犲叆锛宑omposite action 浼氱户鎵裤€?
      # renew-kit 閽夊湪 tag 涓婏紙action 涓?pip 涓ゅ閮借閽夛級锛歮ain 涓婂嚭杩囦竴娆?composite
      # action 鐨勮娉曢敊锛堢┖ then 鍒嗘敮锛夛紝鎵€鏈夎窡 @main 鐨勪粨搴撲竴璧峰彉绾?鈥斺€?鏈粨褰撴椂
      # 鐢ㄧ殑鏄棫鐗?action 鎵嶄茎骞歌翰杩囥€傚崌绾у氨鏀硅繖涓や釜 v0.4.2銆?
      - name: 鎵ц缁害
        id: renew
        continue-on-error: true
        uses: jardanlau2020/renew-kit/.github/actions/renew@v0.6.0
        with:
          script: renew.py
          python-version: "3.12"
          renewkit-ref: v0.6.0
          requirements: requirements.txt
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          PANEL_USER: ${{ secrets.PANEL_USER }}
          PANEL_PASS: ${{ secrets.PANEL_PASS }}
          SERVER_IDS: ${{ secrets.SERVER_IDS }}
          # 2026-11-23锛氶閫夌函 Bearer锛堜笉鐧诲綍銆佷笉杩?Turnstile銆佷笉鍙?cookie 瀵垮懡褰卞搷锛?
          HS_API_KEY: ${{ secrets.HS_API_KEY }}
          JEXACTYL_SESSION: ${{ secrets.JEXACTYL_SESSION }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}

      # 鈹€鈹€ 2026-11-23 鑷剤锛氫笁绉嶈璇侊紙API Key / cookie / 甯愬瘑锛夊叏鎸傛椂涓诲姩閲嶆柊鐧诲綍 鈹€鈹€
      # login-refresh.yml 浼氳嚜宸辩櫥褰?+ 鐢?GH_PAT 鍥炲啓 secret锛屼絾瀹冪殑瀹氭椂鏄€屾瘡 3 澶╀竴娆°€嶏紱
      # cookie 鑻ュ湪涓ゆ涔嬮棿姝绘帀锛堢珯鏂规竻 session銆佹崲瀵嗛挜锛夛紝灏变細绌虹瓑鏈€澶?3 澶┿€?
      # 杩欓噷澶辫触鍗宠Е鍙戜竴娆★紝涓嬩竴杞?cron锛? 灏忔椂锛夊氨鑳芥嬁鍒版柊 cookie銆?
      # 鐢?workflow 鑷繁鐨?token锛坅ctions: write锛夛紝涓嶉渶瑕侀澶?PAT銆?
      - name: 鑷剤 路 璁よ瘉澶辫触鍒欒Е鍙戦噸鏂扮櫥褰?
        if: steps.renew.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "鏈疆缁害澶辫触锛堣璇佹垨涓婃父锛夆啋 瑙﹀彂 login-refresh.yml 閲嶆柊鐧诲綍骞跺洖鍐?cookie"
          if gh workflow run login-refresh.yml --repo "${{ github.repository }}" --ref main -f mode=login; then
            sleep 8
            gh run list --repo "${{ github.repository }}" --workflow login-refresh.yml --limit 1 \
              --json databaseId,status,event,createdAt \
              --jq '.[] | "宸茶Е鍙?login-refresh run \(.databaseId) status=\(.status) event=\(.event)"'
          else
            echo "::warning::瑙﹀彂 login-refresh 澶辫触 鈥斺€?妫€鏌?workflow 鐨?actions: write 鏉冮檺鎴栦粨璁剧疆"
          fi

      - name: 馃捑 淇濆瓨涓婃父鏁呴殰璁℃暟
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: hs_upstream_state.json
          key: hsupstream-${{ github.run_id }}
      - name: 缁撹 路 鏈疆娌＄画涓婏紙淇濇寔闈炵豢锛屽埆璁╁け璐ョ湅璧锋潵鍍忔垚鍔燂級
        if: steps.renew.outcome == 'failure'
        run: exit 1

