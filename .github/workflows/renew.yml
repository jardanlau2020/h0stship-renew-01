name: Host-Ship 自动续约

on:
  schedule:
    # 每 3 小时 1 次（UTC 每小时 :17，避开整点）。
    # 2026-11-21：cookie 实测只活 6 日，原来 7 日一轮永远差一天，结构性必死。
    # 压到 3 日一轮，漏跑一轮也还有余量；到期预警见 login-refresh.yml 的 guard job。
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (不真正续约)"
        required: false
        default: "false"
        type: boolean
      force_relogin:
        description: "强制先走浏览器登录换 cookie（自愈路径自测用）"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

concurrency:
  group: hostship-renew
  cancel-in-progress: false

jobs:
  renew:
    name: 续约
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出
        uses: actions/checkout@v7

      # 上游故障计数（连续几轮 522）。GHA 每次都是新容器，不恢复就是每轮从 0 起，
      # 「连续 3 轮才升级告警」永远触发不了。
      - name: ♻️ 恢复上游故障计数
        uses: actions/cache/restore@v4
        with:
          path: hs_upstream_state.json
          key: hsupstream-${{ github.run_id }}
          restore-keys: |
            hsupstream-

      # ══════════════ 2026-11-23 自愈：cookie 死了就现场登录换一条 ══════════════
      # 背景：站方 2026-11-23 那次 522 之后把 session 存储清了，两个账号的
      # jexactyl_session 同时 401，而登录接口要 Turnstile，纯 API 登录结构性过不了 ——
      # 结果就是「cookie 一死必须有人手工粘」，这不是自动化。
      # 现成能力其实仓库里就有：login_refresh.py（seleniumbase + xvfb + 系统级鼠标点
      # Turnstile）实测能过盾拿到 4 个 cookie。所以把它搬进续约流程：
      #   ① 注入 secret 里的 cookie → ② 探活 /api/client/account → ③ 401 就先登录换新的
      #   → ④ 再跑续约（只跑一次，不产生「先失败再重试」的假告警）
      # 顺序按「先探活后登录」，避免 renew 先撞 401 触发 telegram 误报。
      - name: 注入 cookie（secret → env）
        env:
          COOKIE: ${{ secrets.JEXACTYL_SESSION }}
        run: |
          set -eu
          if [ -n "${COOKIE:-}" ]; then
            echo "JEXACTYL_SESSION=$COOKIE" >> "$GITHUB_ENV"
            echo "已注入 secret 里的 cookie，长度 ${#COOKIE}"
          else
            echo "secret 里没有 JEXACTYL_SESSION，将直接走自愈登录"
          fi

      - name: cookie 探活
        id: probe
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
        run: |
          set +e
          code=$(curl -s -o /tmp/account.json -w '%{http_code}' --max-time 25 \
            -H "Cookie: jexactyl_session=${JEXACTYL_SESSION}" \
            -H "Accept: application/json" \
            "${PANEL_URL%/}/api/client/account")
          echo "探活 GET /api/client/account → HTTP $code"
          if [ "$code" = "200" ]; then
            echo "alive=true" >> "$GITHUB_OUTPUT"
          else
            echo "alive=false" >> "$GITHUB_OUTPUT"
            echo "cookie 不可用（HTTP $code），本轮先自愈登录"
          fi
          exit 0

      - name: 自愈 · 装图形依赖与 Xvfb
        if: steps.probe.outputs.alive != 'true' || github.event.inputs.force_relogin == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11-utils libgbm1 fonts-noto-cjk

      - name: 自愈 · 装 seleniumbase
        if: steps.probe.outputs.alive != 'true' || github.event.inputs.force_relogin == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install 'seleniumbase==4.58.3'

      - name: 自愈 · 浏览器登录换 cookie
        if: steps.probe.outputs.alive != 'true' || github.event.inputs.force_relogin == 'true'
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          PANEL_USER: ${{ secrets.PANEL_USER }}
          PANEL_PASS: ${{ secrets.PANEL_PASS }}
        run: |
          set +e
          timeout -k 10 480 xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            python login_refresh.py > login.log 2>&1
          rc=$?
          cat login.log
          if [ "$rc" -ne 0 ]; then
            echo "::error::自愈登录失败（exit $rc），下面继续用旧 cookie 跑，失败会照常告警"
            exit 0
          fi
          COOKIE=$(awk -F= '/^JEXACTYL_SESSION=/{sub(/^JEXACTYL_SESSION=/,"");print;exit}' cookies.txt)
          if [ -z "$COOKIE" ]; then
            echo "::error::登录成功但 cookies.txt 里没有 jexactyl_session"
            exit 1
          fi
          # 值不打印：只写进后续步骤的 env，日志里只出现「已写入 + 长度」
          echo "JEXACTYL_SESSION=$COOKIE" >> "$GITHUB_ENV"
          rm -f cookies.txt .session.tmp
          echo "✅ 已拿到新 cookie，长度 ${#COOKIE}"

      # 迁移说明：原先手写 setup-python / pip install / 执行 三步，
      # 现改用 renew-kit 的 composite action，自动装好 Python 与 renewkit，
      # 并在脚本异常退出时兜底发一条 Telegram 通知。
      # 面板凭据通过本 step 的 env 传入，composite action 会继承。
      # renew-kit 钉在 tag 上（action 与 pip 两处都要钉）：main 上出过一次 composite
      # action 的语法错（空 then 分支），所有跟 @main 的仓库一起变红 —— 本仓当时
      # 用的是旧版 action 才侥幸躲过。升级就改这两个 v0.4.2。
      # 注意：JEXACTYL_SESSION 不在这里显式声明 —— 否则会覆盖上面自愈写进
      # $GITHUB_ENV 的新 cookie。旧值/新值都走 env 继承。
      - name: 执行续约
        uses: jardanlau2020/renew-kit/.github/actions/renew@v0.5.3
        with:
          script: renew.py
          python-version: "3.12"
          renewkit-ref: v0.5.3
          requirements: requirements.txt
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          PANEL_USER: ${{ secrets.PANEL_USER }}
          PANEL_PASS: ${{ secrets.PANEL_PASS }}
          SERVER_IDS: ${{ secrets.SERVER_IDS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}

      - name: 💾 保存上游故障计数
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: hs_upstream_state.json
          key: hsupstream-${{ github.run_id }}
