name: tmp-secret-fingerprint
on:
  workflow_dispatch:
permissions: {}
jobs:
  fp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: fingerprint
        env:
          PU: ${{ secrets.PANEL_USER }}
          PP: ${{ secrets.PANEL_PASS }}
        run: |
          echo "PANEL_USER_sha12=$(printf '%s' "$PU" | sha256sum | cut -c1-12)"
          echo "PANEL_USER_len=${#PU}"
          echo "PANEL_PASS_sha12=$(printf '%s' "$PP" | sha256sum | cut -c1-12)"
          echo "PANEL_PASS_len=${#PP}"
