name: 登录并导出 cookie

# 探针（run 44895479028）已验证：账密 + 系统级鼠标点 Turnstile 一次即过（token_len=709），
# 登录成功。本 workflow 把那个探针变成可用工具。
#
# 2026-11-21 追加：cookie 只活约 6 日，cron 已经压到 3 日一轮，但漏跑一轮仍会死。
# 所以加 guard job：每天只读探一次 secret 里的 cookie，按「上次刷新时刻 + 6 日 TTL」
# 推算到期，剩不到 2 日或已经失效就报警。
#
# 2026-11-23 改造（自愈闭环）：
#   · guard 不再只是「发 TG 叫人」，判定需要换 cookie 时直接触发同 workflow 的 refresh job；
#   · refresh 拿到 cookie 后，若配了 secret GH_PAT 就用 gh secret set 自动回写
#     JEXACTYL_SESSION —— 这是唯一需要 PAT 的一步（GITHUB_TOKEN 无权写 secrets）。
#     没配 GH_PAT 时不报错、只跳过，此时靠 renew.yml 的「探活 + 浏览器登录」兜底，
#     整条链依然无人值守。
#   · cookie 值不进日志：只经文件/stdin 传给 gh，日志只打印长度。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "login = 登录并导出 cookie；check = 只跑到期巡检（不启动浏览器）"
        required: false
        default: "login"
        type: choice
        options:
          - login
          - check
  schedule:
    # 每日 1 次巡检（UTC 07:41 = 北京 15:41），避开整点与续约任务时段
    - cron: '41 7 * * *'

permissions:
  contents: read

concurrency:
  group: hostship-login-refresh
  cancel-in-progress: false

jobs:
  # ── 每日巡检：只读探活；判定需要换 cookie 就由下面的 refresh job 自愈 ──
  guard:
    name: cookie 到期巡检
    if: github.event_name == 'schedule' || inputs.mode == 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      need_refresh: ${{ steps.probe.outputs.need_refresh }}

    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 装 renewkit
        run: |
          python -m pip install --upgrade pip
          pip install "renewkit @ git+https://github.com/jardanlau2020/renew-kit@v0.5.3"

      # 状态文件只有时间戳和长度（无 cookie 值），用 cache 跨 run 传递。
      # continue-on-error：cache 服务抖动/版本差异不能把巡检本身搞红。
      - name: 恢复状态
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .cookie-state.json
          key: hostship-01-cookie-state-${{ github.run_id }}
          restore-keys: hostship-01-cookie-state-

      - name: 巡检 cookie 有效期
        id: probe
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          JEXACTYL_SESSION: ${{ secrets.JEXACTYL_SESSION }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set +e
          python login_refresh.py --check 2>&1 | tee check.log
          # login_refresh.py --check 固定 exit 0（只报不红），靠 PROBE_RESULT_JSON 里的
          # "alert": true 判断是否需要换 cookie。
          if grep -q '"alert": true' check.log; then
            echo "need_refresh=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ 巡检判定需要换 cookie → 本 workflow 直接跑 login 自愈"
          else
            echo "need_refresh=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: 保存状态
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .cookie-state.json
          key: hostship-01-cookie-state-${{ github.run_id }}

  # ── 登录导出：手动 dispatch（mode=login）或 guard 判定需要换 cookie 时自动跑 ──
  refresh:
    name: 登录导出
    needs: [guard]
    if: >-
      always() && (
        (github.event_name == 'workflow_dispatch' && inputs.mode != 'check')
        || needs.guard.outputs.need_refresh == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # PAT 只用于「写 secret」这一步；没配就跳过（见文首说明）。
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 装图形依赖与 Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11-utils libgbm1 fonts-noto-cjk
          which Xvfb || exit 1
          which xvfb-run || exit 1

      - name: 装 seleniumbase
        run: |
          python -m pip install --upgrade pip
          pip install 'seleniumbase==4.58.3'
          python -c "import seleniumbase; print('seleniumbase', seleniumbase.__version__)"

      - name: 恢复状态
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .cookie-state.json
          key: hostship-01-cookie-state-${{ github.run_id }}
          restore-keys: hostship-01-cookie-state-

      - name: 登录并导出 cookie
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          PANEL_USER: ${{ secrets.PANEL_USER }}
          PANEL_PASS: ${{ secrets.PANEL_PASS }}
        run: |
          set +e
          timeout -k 10 600 xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            python login_refresh.py > login.log 2>&1
          rc=$?
          echo "exit code: $rc"
          cat login.log
          exit $rc

      # 唯一需要 PAT 的一步：GITHUB_TOKEN 无权写 repository secrets。
      # 值全程走文件 / stdin，日志只打印长度。
      - name: 回写 secret JEXACTYL_SESSION（配了 GH_PAT 才执行）
        run: |
          set -euo pipefail
          if [ -z "${GH_PAT:-}" ]; then
            echo "未配置 GH_PAT → 跳过 secret 回写。cookie 只在 artifact 里；"
            echo "本仓库的无人值守由 renew.yml 的「探活 + 浏览器登录」兜底，功能不受影响。"
            exit 0
          fi
          if [ ! -s cookies.txt ]; then
            echo "没有 cookies.txt（登录未成功？），跳过回写"
            exit 0
          fi
          awk -F= '/^JEXACTYL_SESSION=/{sub(/^JEXACTYL_SESSION=/,"");print;exit}' cookies.txt > .session.tmp
          n=$(wc -c < .session.tmp | tr -d ' ')
          if [ "${n:-0}" -lt 20 ]; then
            echo "cookie 长度异常（$n），跳过回写"
            rm -f .session.tmp
            exit 1
          fi
          GH_TOKEN="$GH_PAT" gh secret set JEXACTYL_SESSION --repo "${{ github.repository }}" < .session.tmp
          rm -f .session.tmp
          echo "✅ 已写入 secret JEXACTYL_SESSION，长度 $n"

      - name: 保存状态
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .cookie-state.json
          key: hostship-01-cookie-state-${{ github.run_id }}

      - name: 上传日志与截图
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: login-output
          # 冷王 2026-11-21：cookies.txt 里有明文凭证，artifact 默认留 90 天太长，
          # 缩到 1 天。日志文件里没有明文（脚本只打印长度，不打印值）。
          retention-days: 1
          path: |
            login.log
            cookies.txt
            login_fail.png
          if-no-files-found: ignore
