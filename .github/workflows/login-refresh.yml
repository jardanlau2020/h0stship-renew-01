name: 登录并导出 cookie

# 探针（run 44895479028）已验证：账密 + 系统级鼠标点 Turnstile 一次即过（token_len=709），
# 登录成功。本 workflow 把那个探针变成可用工具。
#
# ── 2026-11-23：闭环 ──────────────────────────────────────────────────
# 原版只导出 cookies.txt（artifact），要人手复制到 secret，于是每 6 天要人来一趟。
# 现在登录成功后由脚本自己用 GH_PAT 回写 secret JEXACTYL_SESSION（sealed box 加密，
# 值不打印、不进日志），并加了「每 3 天一次」的 schedule：
#   · cookie 实测寿命约 6 日 → 3 日一轮 = 一倍余量，任何一轮失败下一轮还能补上；
#   · 每轮先巡检，剩余 >= REFRESH_IF_BELOW_DAYS（默认 4 日）直接跳过，不烧 Actions 分钟；
#   · 成功 / 失败都发 TG，失败带原因（Turnstile 未过 / 账密错 / 面板改版 / 回写失败）。
# 需要的新 secret 只有一个：GH_PAT（细粒度 PAT，这两个仓的 Secrets: Read and write
# + Actions: Read）。没配也能跑，只是降级成「只导出 artifact」，会在 TG 里明确报出来。
#
# 2026-11-21 追加：加 guard job，只读探一次 secret 里的 cookie，按「上次刷新时刻 + 6 日
# TTL」推算到期，剩不到 2 日或已经失效就发 TG 叫人。guard 不登录、不碰浏览器，跑 10 秒。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = 先巡检再决定；login = 直接登录并回写；check = 只跑到期巡检"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - login
          - check
  schedule:
    # 每 3 天一次：UTC 06:23 = 北京 14:23（避开整点、避开 renew 的 :17 时段）
    - cron: '23 6 */3 * *'

permissions:
  contents: read

# 同一个仓只跑一份：定时与手点撞车时排队，不并发（两个浏览器同时登录会互相踢 session）。
concurrency:
  group: hostship-login-refresh-hostship-01
  cancel-in-progress: false

jobs:
  # ── 只读巡检：不登录、不碰浏览器，10 秒 ──────────────────────────────
  guard:
    name: cookie 到期巡检
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 装 renewkit
        run: |
          python -m pip install --upgrade pip
          pip install "renewkit @ git+https://github.com/jardanlau2020/renew-kit@v0.5.3"

      # 状态文件只有时间戳和长度（无 cookie 值），用 cache 跨 run 传递。
      # continue-on-error：cache 服务抖动/版本差异不能把巡检本身搞红。
      - name: 恢复状态
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .cookie-state.json
          key: hostship-01-cookie-state-${{ github.run_id }}
          restore-keys: hostship-01-cookie-state-

      - name: 巡检 cookie 有效期
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          JEXACTYL_SESSION: ${{ secrets.JEXACTYL_SESSION }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python login_refresh.py --check

      - name: 保存状态
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .cookie-state.json
          key: hostship-01-cookie-state-${{ github.run_id }}

  # ── 自动刷新（定时）+ 手动登录导出 ────────────────────────────────────
  refresh:
    name: 登录导出
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'check')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 装图形依赖与 Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11-utils libgbm1 fonts-noto-cjk
          which Xvfb || exit 1
          which xvfb-run || exit 1

      - name: 装 seleniumbase 与 pynacl
        run: |
          python -m pip install --upgrade pip
          pip install 'seleniumbase==4.58.3' 'pynacl>=1.5'
          python -c "import seleniumbase, nacl; print('seleniumbase', seleniumbase.__version__, '| pynacl ok')"

      - name: 恢复状态
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .cookie-state.json
          key: hostship-01-cookie-state-${{ github.run_id }}
          restore-keys: hostship-01-cookie-state-

      - name: 登录并导出 cookie
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          PANEL_USER: ${{ secrets.PANEL_USER }}
          PANEL_PASS: ${{ secrets.PANEL_PASS }}
          JEXACTYL_SESSION: ${{ secrets.JEXACTYL_SESSION }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 细粒度 PAT：只给本仓 Secrets: Read and write + Actions: Read。
          # 没配时脚本降级为「只导出 artifact」，TG 会明确报「回写失败」。
          GH_PAT: ${{ secrets.GH_PAT }}
          WRITEBACK_SECRET: JEXACTYL_SESSION
          REFRESH_IF_BELOW_DAYS: "4"
        run: |
          set +e
          # 定时 → --auto（先巡检，够新就跳过）；手动 login → 强制真登录
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "auto" ]; then
            ARGS="--auto"
          else
            ARGS=""
          fi
          echo "mode: ${{ github.event_name }} / ${{ inputs.mode }} | args: '$ARGS'"
          timeout -k 10 900 xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            python login_refresh.py $ARGS > login.log 2>&1
          rc=$?
          echo "exit code: $rc"
          cat login.log
          exit $rc

      - name: 保存状态
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .cookie-state.json
          key: hostship-01-cookie-state-${{ github.run_id }}

      - name: 上传日志与截图
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: login-output
          # 冷王 2026-11-21：cookies.txt 里有明文凭证，artifact 默认留 90 天太长，
          # 缩到 1 天。日志文件里没有明文（脚本只打印长度，不打印值）。
          retention-days: 1
          path: |
            login.log
            cookies.txt
            login_fail.png
          if-no-files-found: ignore
